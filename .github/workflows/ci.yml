name: CI

# Runs on every push to any branch, plus every pull request.
on:
    push:
        branches: ["**"]
    pull_request:

# A new push to the same ref cancels the previous in-flight run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ────────────────────────────────────────────────────────────────
    # PHP static analysis: lint + PHPStan (level 6) + PHPCS (PSR-12).
    # Kept separate from the `tests` job so static-analysis debt and the
    # test outcome surface as two independent checks — a red PHPStan no
    # longer hides (or skips) the PHPUnit result. Tools live under app/.
    # ────────────────────────────────────────────────────────────────
    quality:
        name: PHP quality (lint, phpstan, phpcs)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: app

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP 8.3
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: pdo, pdo_pgsql, curl, mbstring, json
                  tools: composer:v2
                  coverage: none

            - name: Resolve composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dev dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: PHP syntax check
              run: find src public tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

            - name: PHPStan (level 6)
              run: vendor/bin/phpstan analyse --no-progress --error-format=github

            - name: PHPCS (PSR-12) — informational
              # Pre-existing code has 70 style violations (67 auto-fixable).
              # Step kept informational until cleaned up: run
              # `composer cbf` locally to auto-fix, then remove
              # `continue-on-error` here. Tracking metric: PHPCS error count
              # must trend down, never up.
              continue-on-error: true
              run: vendor/bin/phpcs --report=full

    # ────────────────────────────────────────────────────────────────
    # PHP tests: PHPUnit (unit + integration suites under app/tests).
    # A standalone job so the test result is a check of its own,
    # independent from the static-analysis job above — a failing test
    # turns this red on its own, and PHPStan debt never skips it.
    # ────────────────────────────────────────────────────────────────
    tests:
        name: PHP tests (phpunit)
        runs-on: ubuntu-latest

        # The integration suite (tests/Integration) runs against a real
        # Postgres. IntegrationTestCase skips when DB_* is unreachable, so
        # this service is what makes those tests actually execute in CI; the
        # unit suite ignores it.
        services:
            postgres:
                image: postgres:14
                env:
                    POSTGRES_DB: iamu_ci
                    POSTGRES_USER: iamu_ci
                    POSTGRES_PASSWORD: iamu_ci_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U iamu_ci"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        defaults:
            run:
                working-directory: app

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP 8.3
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: pdo, pdo_pgsql, curl, mbstring, json
                  tools: composer:v2
                  coverage: none

            - name: Resolve composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dev dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Load database schema (for the integration suite)
              env:
                  PGPASSWORD: iamu_ci_password
              run: |
                  psql -h localhost -p 5432 -U iamu_ci -d iamu_ci -v ON_ERROR_STOP=1 -f ../database/schema/01_schema.sql
                  psql -h localhost -p 5432 -U iamu_ci -d iamu_ci -v ON_ERROR_STOP=1 -f ../database/schema/02_triggers.sql

            - name: PHPUnit
              env:
                  DB_HOST: localhost
                  DB_PORT: "5432"
                  DB_NAME: iamu_ci
                  DB_USER: iamu_ci
                  DB_PASSWORD: iamu_ci_password
              run: vendor/bin/phpunit --display-warnings

    # ────────────────────────────────────────────────────────────────
    # Infrastructure: docker-compose.yaml stays parseable
    # ────────────────────────────────────────────────────────────────
    infra:
        name: docker compose config
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Seed .env from .env.example (or sane defaults)
              run: |
                  if [ -f .env.example ]; then
                    cp .env.example .env
                  else
                    cat > .env <<EOF
                  DB_HOST=db
                  DB_PORT=5432
                  DB_NAME=iamu_ci
                  DB_USER=iamu_ci
                  DB_PASSWORD=iamu_ci_password
                  OLLAMA_BASE_URL=http://ollama2:11434
                  APP_ENV=ci
                  EOF
                  fi

            - name: Validate compose syntax
              run: docker compose config --quiet
